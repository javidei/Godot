html/head_include="<style>\nhtml,body{width:100%;height:100%;margin:0;padding:0;background:#090604;overflow:hidden}\nbody{position:fixed;inset:0;width:100vw;height:100dvh;overscroll-behavior:none;touch-action:none}\n#canvas{position:fixed!important;inset:0!important;display:block;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important;margin:0!important}\n#status{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;min-width:100vw;min-height:100dvh;background:#090604!important}\n#status-splash{max-width:100%!important;max-height:100%!important}\n#status-splash.fullsize--true{width:100vw!important;height:100dvh!important;object-fit:cover!important}\n#rotate-device-overlay{position:fixed;inset:0;z-index:999999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;padding:32px;box-sizing:border-box;text-align:center;background:radial-gradient(circle at 50% 38%,#2c1b12 0,#100a07 58%,#050302 100%);color:#fff1dc;font-family:Arial,sans-serif}\n#rotate-device-overlay.is-visible{display:flex}\n#rotate-device-overlay .rotate-phone{width:54px;height:92px;border:3px solid #e4b968;border-radius:12px;position:relative;animation:rotateDevice 1.8s ease-in-out infinite}\n#rotate-device-overlay .rotate-phone:after{content:\"\";position:absolute;width:18px;height:3px;border-radius:3px;background:#e4b968;left:50%;bottom:7px;transform:translateX(-50%)}\n#rotate-device-overlay strong{font-size:22px;color:#f2c97e}\n#rotate-device-overlay span{max-width:330px;font-size:15px;line-height:1.45;color:#d8c7af}\n@keyframes rotateDevice{0%,20%{transform:rotate(0deg)}60%,100%{transform:rotate(90deg)}}\n</style>\n<script>\n(function(){\n  const mobileLike=()=>navigator.maxTouchPoints>0&&Math.min(screen.width,screen.height)<=1200;\n  const portrait=()=>window.matchMedia&&window.matchMedia(\"(orientation: portrait)\").matches;\n  let overlay=null;\n  let deferredInstallPrompt=null;\n\n  async function lockLandscape(){\n    if(!mobileLike()||!screen.orientation||!screen.orientation.lock)return;\n    try{await screen.orientation.lock(\"landscape\");}catch(e){}\n  }\n\n  async function requestFullscreen(){\n    if(document.fullscreenElement){await lockLandscape();return true;}\n    if(!document.documentElement.requestFullscreen)return false;\n    try{\n      await document.documentElement.requestFullscreen({navigationUI:\"hide\"});\n    }catch(e){\n      try{await document.documentElement.requestFullscreen();}catch(inner){return false;}\n    }\n    await lockLandscape();\n    return true;\n  }\n\n  window.entreLineasRequestFullscreen=requestFullscreen;\n  window.entreLineasToggleFullscreen=async()=>{\n    if(document.fullscreenElement&&document.exitFullscreen){\n      try{await document.exitFullscreen();}catch(e){}\n      return;\n    }\n    await requestFullscreen();\n  };\n\n  window.addEventListener(\"beforeinstallprompt\",event=>{\n    event.preventDefault();\n    deferredInstallPrompt=event;\n  });\n  window.addEventListener(\"appinstalled\",()=>{deferredInstallPrompt=null;});\n  window.entreLineasInstall=async()=>{\n    const installed=(window.matchMedia&&window.matchMedia(\"(display-mode: fullscreen)\").matches)||(window.matchMedia&&window.matchMedia(\"(display-mode: standalone)\").matches)||window.navigator.standalone===true;\n    if(installed){alert(\"Entre líneas ya está instalado en este dispositivo.\");return true;}\n    if(deferredInstallPrompt){\n      deferredInstallPrompt.prompt();\n      try{await deferredInstallPrompt.userChoice;}catch(e){}\n      deferredInstallPrompt=null;\n      return true;\n    }\n    alert(\"En Android, abre el menú del navegador y selecciona ‘Instalar aplicación’ o ‘Añadir a pantalla de inicio’.\");\n    return false;\n  };\n\n  function ensureOverlay(){\n    if(overlay||!document.body)return overlay;\n    overlay=document.createElement(\"div\");\n    overlay.id=\"rotate-device-overlay\";\n    overlay.innerHTML='<div class=\"rotate-phone\" aria-hidden=\"true\"></div><strong>Gira el móvil</strong><span>Entre líneas está diseñado para jugarse en horizontal. Gira el dispositivo para continuar.</span>';\n    document.body.appendChild(overlay);\n    overlay.addEventListener(\"click\",requestFullscreen);\n    return overlay;\n  }\n  function sync(){\n    const node=ensureOverlay();\n    if(!node)return;\n    node.classList.toggle(\"is-visible\",mobileLike()&&portrait());\n  }\n  document.addEventListener(\"DOMContentLoaded\",()=>{\n    ensureOverlay();\n    sync();\n    window.addEventListener(\"resize\",sync,{passive:true});\n    window.addEventListener(\"orientationchange\",sync,{passive:true});\n    if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener(\"change\",sync);\n    document.addEventListener(\"fullscreenchange\",()=>{sync();if(document.fullscreenElement)lockLandscape();});\n  });\n})();\n</script>"
