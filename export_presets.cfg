html/head_include="<style>\nhtml,body{width:100%;height:100%;margin:0;padding:0;background:#090604;overflow:hidden}\nbody{min-height:100dvh;min-width:100vw}\n#canvas{display:block;width:100vw!important;height:100dvh!important;max-width:none!important;max-height:none!important}\n#status{position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;min-width:100vw;min-height:100dvh;background:#090604!important}\n#status-splash{max-width:100%!important;max-height:100%!important}\n#status-splash.fullsize--true{width:100vw!important;height:100dvh!important;object-fit:contain!important}\n#rotate-device-overlay{position:fixed;inset:0;z-index:999999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:22px;padding:32px;text-align:center;background:radial-gradient(circle at 50% 38%,#2c1b12 0,#100a07 58%,#050302 100%);color:#fff1dc;font-family:Arial,sans-serif}\n#rotate-device-overlay.is-visible{display:flex}\n#rotate-device-overlay .rotate-phone{width:54px;height:92px;border:3px solid #e4b968;border-radius:12px;position:relative;animation:rotateDevice 1.8s ease-in-out infinite}\n#rotate-device-overlay .rotate-phone:after{content:\"\";position:absolute;width:18px;height:3px;border-radius:3px;background:#e4b968;left:50%;bottom:7px;transform:translateX(-50%)}\n#rotate-device-overlay strong{font-size:22px;color:#f2c97e}\n#rotate-device-overlay span{max-width:330px;font-size:15px;line-height:1.45;color:#d8c7af}\n@keyframes rotateDevice{0%,20%{transform:rotate(0deg)}60%,100%{transform:rotate(90deg)}}\n</style>\n<script>\n(function(){\n  const mobileLike=()=>navigator.maxTouchPoints>0&&Math.min(screen.width,screen.height)<=1100;\n  const portrait=()=>window.matchMedia&&window.matchMedia(\"(orientation: portrait)\").matches;\n  let overlay=null;\n  function ensureOverlay(){\n    if(overlay||!document.body)return overlay;\n    overlay=document.createElement(\"div\");\n    overlay.id=\"rotate-device-overlay\";\n    overlay.innerHTML='<div class=\"rotate-phone\" aria-hidden=\"true\"></div><strong>Gira el móvil</strong><span>Entre líneas está diseñado para jugarse en horizontal. Gira el dispositivo para continuar.</span>';\n    document.body.appendChild(overlay);\n    overlay.addEventListener(\"click\",async()=>{\n      try{\n        if(!document.fullscreenElement&&document.documentElement.requestFullscreen){\n          await document.documentElement.requestFullscreen({navigationUI:\"hide\"});\n        }\n      }catch(e){}\n      try{\n        if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock(\"landscape\");\n      }catch(e){}\n    });\n    return overlay;\n  }\n  function sync(){\n    const node=ensureOverlay();\n    if(!node)return;\n    node.classList.toggle(\"is-visible\",mobileLike()&&portrait());\n  }\n  async function lockLandscape(){\n    if(!mobileLike()||!screen.orientation||!screen.orientation.lock)return;\n    try{await screen.orientation.lock(\"landscape\");}catch(e){}\n  }\n  document.addEventListener(\"DOMContentLoaded\",()=>{\n    ensureOverlay();\n    sync();\n    window.addEventListener(\"resize\",sync,{passive:true});\n    window.addEventListener(\"orientationchange\",sync,{passive:true});\n    if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener(\"change\",sync);\n    document.addEventListener(\"fullscreenchange\",()=>{\n      sync();\n      if(document.fullscreenElement)lockLandscape();\n    });\n  });\n})();\n</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
