name: Aplicar reparto predeterminado 0.10.0

on:
  push:
    branches: [main]
    paths:
      - ".automation/apply-v010-default-roster"

permissions:
  contents: write

concurrency:
  group: apply-v010-default-roster
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Aplicar 0.10.0
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # La plantilla conserva todo el reparto en datos, pero una run nueva
          # parte únicamente de Javi y Fran/Smokey.
          config_path = Path("data/game_config.json")
          config = config_path.read_text(encoding="utf-8")
          if '"default_active_characters"' not in config:
              config = config.replace(
                  '  "schema_version": 2,\n',
                  '  "schema_version": 2,\n  "default_active_characters": ["javi", "smokey"],\n',
                  1,
              )
          config_path.write_text(config, encoding="utf-8")

          dm_path = Path("autoload/data_manager_v103.gd")
          dm = dm_path.read_text(encoding="utf-8")
          if "DEFAULT_ACTIVE_CHARACTERS_KEY_1000" not in dm:
              roster_code = '''
const DEFAULT_ACTIVE_CHARACTERS_KEY_1000 := "default_active_characters"


# 0.10.0: el reparto completo sigue cargado y disponible, pero una run nueva
# puede declarar un subconjunto predeterminado desde game_config.json.
func get_default_active_characters() -> Array[String]:
\tensure_loaded()
\tvar all_ids: Array[String] = []
\tfor raw_id in get_all_character_ids(true):
\t\tall_ids.append(str(raw_id))
\tvar configured: Variant = _game_config.get(DEFAULT_ACTIVE_CHARACTERS_KEY_1000, [])
\tvar result: Array[String] = []
\tif typeof(configured) == TYPE_ARRAY:
\t\tfor raw_id in configured as Array:
\t\t\tvar character_id := str(raw_id)
\t\t\tif all_ids.has(character_id) and not result.has(character_id):
\t\t\t\tresult.append(character_id)
\treturn result if not result.is_empty() else all_ids


func get_runtime_active_characters() -> Array[String]:
\tif _runtime_roster_enabled:
\t\treturn super()
\treturn get_default_active_characters()


func migrate_save_state(state: Dictionary) -> Dictionary:
\t# Un slot que ya guardó su reparto lo conserva exactamente. Solo las partidas
\t# nuevas (o guardados tan antiguos que nunca tuvieron roster) usan el default.
\tvar raw_active: Variant = state.get("active_characters", null)
\tvar had_explicit_roster := typeof(raw_active) == TYPE_ARRAY and not (raw_active as Array).is_empty()
\tvar requested: Array = (raw_active as Array).duplicate() if had_explicit_roster else []
\tvar result: Dictionary = super(state)
\tif not had_explicit_roster:
\t\tresult["active_characters"] = get_default_active_characters()
\t\treturn result

\tvar all_ids: Array[String] = []
\tfor raw_id in get_all_character_ids(true):
\t\tall_ids.append(str(raw_id))
\tvar filtered: Array[String] = []
\tfor raw_id in requested:
\t\tvar character_id := str(raw_id)
\t\tif all_ids.has(character_id) and not filtered.has(character_id):
\t\t\tfiltered.append(character_id)
\tresult["active_characters"] = filtered if not filtered.is_empty() else get_default_active_characters()
\treturn result


'''
              dm = dm.replace('extends "res://autoload/data_manager_v102.gd"\n\n', 'extends "res://autoload/data_manager_v102.gd"\n\n' + roster_code, 1)
          dm_path.write_text(dm, encoding="utf-8")

          guest_path = Path("scripts/version_101_guest_character_select.gd")
          guest = guest_path.read_text(encoding="utf-8")
          guest = guest.replace(
              "# slot, el jugador entra siempre como Invitado y los siete miembros del grupo\n# permanecen disponibles como NPC.\n",
              "# slot, el jugador entra siempre como Invitado. El reparto completo sigue\n# disponible, aunque la run usa por defecto el subconjunto configurado en datos.\n",
          )
          guest_path.write_text(guest, encoding="utf-8")

          project_path = Path("project.godot")
          project = project_path.read_text(encoding="utf-8")
          project = project.replace('config/version="0.9.42"', 'config/version="0.10.0"', 1)
          if "; 0.10.0:" not in project:
              project = project.rstrip() + "\n; 0.10.0: las runs nuevas parten por defecto solo con Javi y Fran/Smokey activos; el resto del reparto permanece disponible.\n"
          project_path.write_text(project, encoding="utf-8")

          changelog_path = Path("docs/CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          if "## [0.10.0] - 2026-08-23" not in changelog:
              release = '''## [0.10.0] - 2026-08-23

### Changed

- Las nuevas partidas arrancan por defecto con **Javi** y **Smokey / Fran** como únicos personajes activos de la historia.
- El reparto predeterminado se declara en `data/game_config.json`, de modo que el resto de personajes permanece cargado en datos y puede volver a activarse sin eliminar fichas, habitaciones ni contenido.
- Los guardados que ya tenían un reparto explícito conservan su selección al continuar; el nuevo valor por defecto se aplica únicamente cuando una partida todavía no dispone de roster propio.
- Los smoke tests históricos de roster y guardado aceptan la nueva rama `0.10.x` y validan el reparto inicial Javi + Smokey.

## [0.9.42] - 2026-08-23

### Fixed

- Restauradas las constantes heredadas necesarias para compilar la cadena de transiciones sin recuperar el texto retirado de 2026.

'''
              changelog = changelog.replace("## [0.9.41] - 2026-08-23\n", release + "## [0.9.41] - 2026-08-23\n", 1)
          changelog_path.write_text(changelog, encoding="utf-8")

          smoke_path = Path("scripts/ci_v090_story_roster_smoke_test.gd")
          smoke = smoke_path.read_text(encoding="utf-8")
          smoke = smoke.replace(
              'if not version.begins_with("0.9."):\n\t\t_fail("La prueba requiere la rama 0.9.x")',
              'if not version.begins_with("0.9.") and not version.begins_with("0.10."):\n\t\t_fail("La prueba requiere la rama 0.9.x o 0.10.x")',
              1,
          )
          default_check = '''\tdm.call("reload_all")
\tvar default_ids: Array = dm.call("get_runtime_active_characters")
\tif default_ids != ["javi", "smokey"]:
\t\t_fail("El reparto predeterminado no es Javi + Smokey: %s" % [default_ids])
\t\treturn
'''
          if "El reparto predeterminado no es Javi + Smokey" not in smoke:
              smoke = smoke.replace('\tdm.call("reload_all")\n', default_check, 1)
          smoke_path.write_text(smoke, encoding="utf-8")

          save_smoke_path = Path("scripts/ci_v091_save_resume_smoke_test.gd")
          save_smoke = save_smoke_path.read_text(encoding="utf-8")
          save_smoke = save_smoke.replace(
              'if not version.begins_with("0.9."):\n\t\t_fail("La prueba requiere la rama 0.9.x")',
              'if not version.begins_with("0.9.") and not version.begins_with("0.10."):\n\t\t_fail("La prueba requiere la rama 0.9.x o 0.10.x")',
              1,
          )
          save_smoke_path.write_text(save_smoke, encoding="utf-8")
          PY

      - name: Importar y validar GDScript
        shell: bash
        run: |
          set +e
          godot --headless --editor --path . --quit > import.log 2>&1
          STATUS=$?
          set -e
          cat import.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Failed to load script" import.log; then
            exit 1
          fi

      - name: Validar reparto predeterminado
        shell: bash
        run: |
          set +e
          godot --headless --path . --script res://scripts/ci_v090_story_roster_smoke_test.gd > roster.log 2>&1
          STATUS=$?
          set -e
          cat roster.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "V090 STORY ROSTER FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" roster.log; then
            exit 1
          fi
          grep -q "V090 STORY ROSTER OK:" roster.log

      - name: Commit final limpio
        shell: bash
        run: |
          rm -f .automation/apply-v010-default-roster
          rm -f .github/workflows/apply-v010-default-roster.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "0.10.0 · Javi y Fran como reparto predeterminado"
          git push
