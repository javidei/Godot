name: Aplicar fondo de video del menu 0.6.5

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-menu-video-065.yml"

permissions:
  contents: write

jobs:
  apply-menu-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Integrar eclipse-menu.ogv en el menu
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          video = root / 'assets/video/eclipse-menu.ogv'
          if not video.exists():
              raise SystemExit('Falta assets/video/eclipse-menu.ogv')

          script_path = root / 'scripts/version_065_menu_video.gd'
          script_path.write_text('''extends Node

const VIDEO_PATH := "res://assets/video/eclipse-menu.ogv"
const VIDEO_RATIO := 16.0 / 9.0

var menu_screen: Control
var video_container: AspectRatioContainer
var video_player: VideoStreamPlayer


func _ready() -> void:
\tcall_deferred("_install_menu_video")


func _install_menu_video() -> void:
\tvar main := get_parent()
\tif main == null:
\t\treturn
\tmenu_screen = main.get("menu_screen") as Control
\tif menu_screen == null:
\t\tmenu_screen = main.get_node_or_null("MenuScreen") as Control
\tif menu_screen == null:
\t\tpush_warning("No se encontro MenuScreen para instalar el fondo eclipse.")
\t\treturn

\tvar stream := load(VIDEO_PATH) as VideoStream
\tif stream == null:
\t\tpush_warning("No se pudo cargar " + VIDEO_PATH)
\t\treturn

\tvar fallback := main.get("menu_background") as TextureRect
\tif fallback != null:
\t\tfallback.z_index = -100

\tvideo_container = AspectRatioContainer.new()
\tvideo_container.name = "MenuEclipseVideoContainer065"
\tvideo_container.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
\tvideo_container.ratio = VIDEO_RATIO
\tvideo_container.stretch_mode = AspectRatioContainer.STRETCH_COVER
\tvideo_container.clip_contents = true
\tvideo_container.mouse_filter = Control.MOUSE_FILTER_IGNORE
\tvideo_container.z_index = -90
\tmenu_screen.add_child(video_container)
\tmenu_screen.move_child(video_container, 0)

\tvideo_player = VideoStreamPlayer.new()
\tvideo_player.name = "MenuEclipseVideo065"
\tvideo_player.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
\tvideo_player.expand = true
\tvideo_player.loop = true
\tvideo_player.autoplay = false
\tvideo_player.volume_db = -80.0
\tvideo_player.mouse_filter = Control.MOUSE_FILTER_IGNORE
\tvideo_player.stream = stream
\tvideo_container.add_child(video_player)

\t_soften_menu_shade()
\tmenu_screen.visibility_changed.connect(_sync_menu_video_playback)
\t_sync_menu_video_playback()


func _soften_menu_shade() -> void:
\tif menu_screen == null:
\t\treturn
\tfor child in menu_screen.get_children():
\t\tif child is ColorRect:
\t\t\tvar shade := child as ColorRect
\t\t\tvar shade_color := shade.color
\t\t\tshade_color.a = minf(shade_color.a, 0.50)
\t\t\tshade.color = shade_color
\t\t\treturn


func _sync_menu_video_playback() -> void:
\tif menu_screen == null or video_player == null:
\t\treturn
\tif menu_screen.visible:
\t\tvideo_player.paused = false
\t\tif not video_player.is_playing():
\t\t\tvideo_player.play()
\telse:
\t\tvideo_player.paused = true
''', encoding='utf-8')

          scene_path = root / 'scenes/main.tscn'
          scene = scene_path.read_text(encoding='utf-8')
          scene = scene.replace('[gd_scene load_steps=12 format=3]', '[gd_scene load_steps=13 format=3]', 1)
          ext_line = '[ext_resource type="Script" path="res://scripts/version_065_menu_video.gd" id="12_menu_video"]'
          if ext_line not in scene:
              anchor = '[ext_resource type="Script" path="res://scripts/world_map_manager.gd" id="11_world_map"]'
              if anchor not in scene:
                  raise SystemExit('No se encontro el ancla de WorldMapManager en main.tscn')
              scene = scene.replace(anchor, anchor + '\n' + ext_line, 1)
          node_block = '\n[node name="Version065MenuVideo" type="Node" parent="."]\nscript = ExtResource("12_menu_video")\n'
          if '[node name="Version065MenuVideo"' not in scene:
              scene = scene.rstrip() + '\n' + node_block
          scene_path.write_text(scene, encoding='utf-8')

          project_path = root / 'project.godot'
          project = project_path.read_text(encoding='utf-8')
          project, count = re.subn(r'config/version="[^"]+"', 'config/version="0.6.5"', project, count=1)
          if count != 1:
              raise SystemExit('No se encontro config/version en project.godot')
          project_path.write_text(project, encoding='utf-8')

          changelog_path = root / 'docs/CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          if '## [0.6.5] - 2026-08-14' not in changelog:
              marker = '## [0.6.4] - 2026-08-14'
              section = '''## [0.6.5] - 2026-08-14\n\n### Added\n\n- `eclipse-menu.ogv` se reproduce como fondo animado del menu principal, en bucle y sin interferir con la musica del menu.\n\n### Changed\n\n- El video del menu conserva su proporcion 16:9 mediante un contenedor en modo `cover`, con el fondo estatico anterior como respaldo.\n- La capa oscura del menu se suaviza para dejar visible el eclipse sin perder legibilidad en los controles.\n\n'''
              if marker not in changelog:
                  raise SystemExit('No se encontro la seccion 0.6.4 en CHANGELOG')
              changelog = changelog.replace(marker, section + marker, 1)
              changelog_path.write_text(changelog, encoding='utf-8')
          PY

      - name: Publicar cambios y retirar workflow temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-menu-video-065.yml
          git add scripts/version_065_menu_video.gd scenes/main.tscn project.godot docs/CHANGELOG.md
          git commit -m "feat: usar eclipse como fondo animado del menu"
          git pull --rebase origin main
          git push origin HEAD:main
