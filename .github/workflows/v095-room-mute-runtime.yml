name: Validar mute runtime 0.9.5

on:
  push:
    branches: [main]
    paths:
      - "scripts/version_095_unified_audio_visual.gd"
      - "scripts/ci_v095_room_mute_runtime_test.gd"
      - "scenes/main.tscn"
      - "project.godot"
  workflow_dispatch:

jobs:
  room-mute-runtime:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Importar recursos Godot
        run: |
          set +e
          godot --headless --editor --path . --quit > import.log 2>&1
          STATUS=$?
          set -e
          cat import.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Failed to load script" import.log; then
            exit 1
          fi
      - name: Pulsar mute y validar ambos iconos
        run: |
          set +e
          godot --headless --path . --script res://scripts/ci_v095_room_mute_runtime_test.gd > v095-room-mute.log 2>&1
          STATUS=$?
          set -e
          cat v095-room-mute.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "V095 ROOM MUTE FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" v095-room-mute.log; then
            exit 1
          fi
          grep -q "V095 ROOM MUTE OK:" v095-room-mute.log
