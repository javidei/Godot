name: Validate DataManager Refactor

on:
  push:
    branches:
      - refactor/datamanager-offline
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.1"

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preparar plantillas de exportación
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config"
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot "$HOME/.config/godot"
          fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          fi

      - name: Importar y validar GDScript
        run: |
          set +e
          godot --headless --editor --path . --quit > import.log 2>&1
          STATUS=$?
          set -e
          cat import.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Failed to load script" import.log; then
            exit 1
          fi

      - name: Smoke test DataManager
        run: |
          set +e
          timeout 35s godot --headless --path . --script res://scripts/ci_datamanager_smoke_test.gd > datamanager.log 2>&1
          STATUS=$?
          set -e
          cat datamanager.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "DATAMANAGER FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" datamanager.log; then
            exit 1
          fi
          grep -q "DATAMANAGER OK:" datamanager.log

      - name: Regresión histórica de personajes y escenas
        run: |
          PROJECT_VERSION=$(sed -n 's/^config\/version="\([^"]*\)"/\1/p' project.godot | head -n 1)
          test -n "$PROJECT_VERSION"
          sed -i -E "s/0\.[0-9]+\.[0-9]+/${PROJECT_VERSION}/g" scripts/ci_character_smoke_test.gd
          sed -i 's/menu_content.anchor_right - menu_content.anchor_left < 0.48/menu_content.anchor_right - menu_content.anchor_left > 0.50/' scripts/ci_character_smoke_test.gd
          cp scenes/main.tscn /tmp/main-datamanager.tscn
          sed -i '/\[node name="Version040Manager"/,+1d' scenes/main.tscn
          set +e
          timeout 45s godot --headless --path . --script res://scripts/ci_character_smoke_test.gd > character-smoke.log 2>&1
          STATUS=$?
          set -e
          cat character-smoke.log
          cp /tmp/main-datamanager.tscn scenes/main.tscn
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SMOKE FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" character-smoke.log; then
            exit 1
          fi
          grep -q "SMOKE OK:" character-smoke.log

      - name: Regresión de visitas 0.4.x
        run: |
          set +e
          timeout 45s godot --headless --path . --script res://scripts/ci_v040_smoke_test.gd > v040-smoke.log 2>&1
          STATUS=$?
          set -e
          cat v040-smoke.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "V040 FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" v040-smoke.log; then
            exit 1
          fi
          grep -q "V040 OK:" v040-smoke.log

      - name: Regresión de transiciones
        run: |
          set +e
          timeout 60s godot --headless --path . --script res://scripts/ci_v044_transition_smoke_test.gd > v044-smoke.log 2>&1
          STATUS=$?
          set -e
          cat v044-smoke.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "V044 FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" v044-smoke.log; then
            exit 1
          fi
          grep -q "V044 OK:" v044-smoke.log

      - name: Regresión de HUD
        run: |
          set +e
          timeout 45s godot --headless --path . --script res://scripts/ci_hud_smoke_test.gd > hud-smoke.log 2>&1
          STATUS=$?
          set -e
          cat hud-smoke.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "HUD FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" hud-smoke.log; then
            exit 1
          fi
          grep -q "HUD OK:" hud-smoke.log

      - name: Regresión de menú e interacción
        run: |
          set +e
          timeout 45s godot --headless --path . --script res://scripts/ci_v045_menu_input_smoke_test.gd > menu-smoke.log 2>&1
          STATUS=$?
          set -e
          cat menu-smoke.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "MENU FAIL:|V045 FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" menu-smoke.log; then
            exit 1
          fi
          grep -Eq "MENU OK:|V045 OK:" menu-smoke.log

      - name: Regresión de Extras 0.5.x
        run: |
          set +e
          timeout 45s godot --headless --path . --script res://scripts/ci_v050_extras_codex_test.gd > extras-smoke.log 2>&1
          STATUS=$?
          set -e
          cat extras-smoke.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "V050 FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" extras-smoke.log; then
            exit 1
          fi
          grep -q "V050 OK:" extras-smoke.log

      - name: Exportar Web sin publicar
        run: |
          rm -rf /tmp/datamanager-web
          mkdir -p /tmp/datamanager-web
          set +e
          godot --headless --export-release "Web" /tmp/datamanager-web/index.html > export.log 2>&1
          STATUS=$?
          set -e
          cat export.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Failed to load script" export.log; then
            exit 1
          fi
          test -s /tmp/datamanager-web/index.html
          test -s /tmp/datamanager-web/index.pck
          test -s /tmp/datamanager-web/index.wasm
