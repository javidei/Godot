name: Normalizar roles de personajes actuales

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/normalize-current-character-roles.yml"

permissions:
  contents: write

jobs:
  normalize-roles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Convertir todos los personajes actuales en principales
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('.')

          for path in sorted((root / 'data' / 'characters').glob('*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              if bool(data.get('enabled', True)):
                  data['role'] = 'principal'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          details_path = root / 'data' / 'detalles-juego.json'
          details = json.loads(details_path.read_text(encoding='utf-8'))
          for person in details.get('personajes', []):
              if isinstance(person, dict):
                  person['rol'] = 'principal'

          gameplay = details.setdefault('jugabilidad', {})
          gameplay.pop('personajes_secundarios', None)
          gameplay['personajes_actuales'] = {
              'todos_principales': True,
              'descripcion': 'Los siete personajes actuales tienen rol principal y pueden actuar como protagonista o como personaje relevante de la historia según la partida.'
          }
          details_path.write_text(json.dumps(details, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          project_path = root / 'project.godot'
          project = project_path.read_text(encoding='utf-8')
          project, count = re.subn(r'config/version="[^"]+"', 'config/version="0.6.4"', project, count=1)
          if count != 1:
              raise SystemExit('No se encontró config/version en project.godot')
          project_path.write_text(project, encoding='utf-8')

          changelog_path = root / 'docs' / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          if '## [0.6.4] - 2026-08-14' not in changelog:
              marker = '## [0.6.3] - 2026-08-14'
              section = '''## [0.6.4] - 2026-08-14\n\n### Changed\n\n- Los siete personajes actuales pasan a tener rol `principal` tanto en sus JSON operativos como en `detalles-juego.json`.\n- Eliminada la distinción de personajes secundarios para el reparto actual; todos pueden ser protagonistas y personajes relevantes de la historia.\n\n'''
              if marker not in changelog:
                  raise SystemExit('No se encontró el punto de inserción 0.6.3 en CHANGELOG')
              changelog = changelog.replace(marker, section + marker, 1)
              changelog_path.write_text(changelog, encoding='utf-8')
          PY

      - name: Eliminar workflow temporal y publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/normalize-current-character-roles.yml
          git add -A
          git commit -m "data: todos los personajes actuales son principales"
          git pull --rebase origin main
          git push origin HEAD:main
