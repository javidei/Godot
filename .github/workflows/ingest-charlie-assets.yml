name: Ingest Charlie Assets

on:
  push:
    branches: [main]
    paths:
      - ".asset_upload/ready-charlie-assets"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: charlie-assets-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruir imágenes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/generated
          test -f .asset_upload/charlie-room-00.b64part
          test -f .asset_upload/charlie-portrait-00.b64part
          cat .asset_upload/charlie-room-*.b64part | base64 --decode > assets/generated/charlie-room.jpg
          cat .asset_upload/charlie-portrait-*.b64part | base64 --decode > assets/generated/charlie.png
          test -s assets/generated/charlie-room.jpg
          test -s assets/generated/charlie.png
          file assets/generated/charlie-room.jpg
          file assets/generated/charlie.png

      - name: Guardar assets reales
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/generated/charlie-room.jpg assets/generated/charlie.png
          git rm -rf .asset_upload
          git add .github/workflows/ingest-charlie-assets.yml
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "assets: incorporar habitación y retrato de Charlie"
          git push origin HEAD:main
