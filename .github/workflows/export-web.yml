name: Export Godot Web

on:
  push:
    branches: [main]
    paths-ignore:
      - "web/**"
      - ".asset_upload/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: godot-pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Preparar plantillas de exportación
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config"
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot "$HOME/.config/godot"
          fi
          mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Importar recursos Godot
        run: |
          set +e
          godot --headless --editor --path . --quit > import.log 2>&1
          STATUS=$?
          set -e
          cat import.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Failed to load script" import.log; then
            echo "La importación de recursos contiene errores; no se continuará."
            exit 1
          fi

      - name: Configurar título dinámico
        run: |
          set +e
          godot --headless --path . --script res://scripts/configure_dynamic_title.gd > dynamic-title.log 2>&1
          STATUS=$?
          set -e
          cat dynamic-title.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Failed to load script" dynamic-title.log; then
            echo "No se ha podido calcular el título dinámico."
            exit 1
          fi
          GAME_TITLE=$(sed -n 's/^DYNAMIC TITLE: //p' dynamic-title.log | tail -n 1)
          test -n "$GAME_TITLE"
          echo "GAME_TITLE=$GAME_TITLE" >> "$GITHUB_ENV"

      - name: Smoke test histórico de personajes y escenas
        run: |
          set +e
          godot --headless --path . --script res://scripts/ci_v070_character_smoke_test.gd > character-smoke.log 2>&1
          STATUS=$?
          set -e
          cat character-smoke.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SMOKE FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" character-smoke.log; then
            echo "La prueba histórica de personajes ha fallado; no se exportará."
            exit 1
          fi
          grep -q "SMOKE OK:" character-smoke.log

      - name: Smoke test de mecánicas heredadas 0.4.x
        run: |
          set +e
          godot --headless --path . --script res://scripts/ci_v070_v040_smoke_test.gd > v040-smoke.log 2>&1
          STATUS=$?
          set -e
          cat v040-smoke.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "V040 FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" v040-smoke.log; then
            echo "La validación de mecánicas heredadas ha fallado; no se exportará."
            exit 1
          fi
          grep -q "V040 OK:" v040-smoke.log

      - name: Smoke test de transiciones narrativas
        run: |
          set +e
          godot --headless --path . --script res://scripts/ci_v070_v044_transition_smoke_test.gd > v044-smoke.log 2>&1
          STATUS=$?
          set -e
          cat v044-smoke.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "V044 FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" v044-smoke.log; then
            echo "La validación de fundidos narrativos interactivos ha fallado; no se exportará."
            exit 1
          fi
          grep -q "V044 OK:" v044-smoke.log

      - name: Smoke test de HUD ingame
        run: |
          set +e
          godot --headless --path . --script res://scripts/ci_hud_smoke_test.gd > hud-smoke.log 2>&1
          STATUS=$?
          set -e
          cat hud-smoke.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "HUD FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" hud-smoke.log; then
            echo "La validación del HUD ingame ha fallado; no se exportará."
            exit 1
          fi
          grep -q "HUD OK:" hud-smoke.log

      - name: Smoke test de menú e interacción
        run: |
          set +e
          godot --headless --path . --script res://scripts/ci_v070_v045_menu_input_smoke_test.gd > v045-smoke.log 2>&1
          STATUS=$?
          set -e
          cat v045-smoke.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "V045 FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" v045-smoke.log; then
            echo "La validación del menú compacto y avance por pantalla ha fallado; no se exportará."
            exit 1
          fi
          grep -q "V045 OK:" v045-smoke.log

      - name: Smoke test narrativo de La Palanca III
        run: |
          set +e
          godot --headless --path . --script res://scripts/ci_v01011_palanca_story_smoke_test.gd > palanca-story-smoke.log 2>&1
          STATUS=$?
          set -e
          cat palanca-story-smoke.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "V01011 PALANCA FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" palanca-story-smoke.log; then
            echo "La experiencia narrativa de La Palanca III ha fallado; no se exportará."
            exit 1
          fi
          grep -q "V01011 PALANCA OK:" palanca-story-smoke.log

      - name: Smoke test de Extras y códice 0.5/0.6
        run: |
          set +e
          godot --headless --path . --script res://scripts/ci_v070_v050_extras_codex_test.gd > v050-smoke.log 2>&1
          STATUS=$?
          set -e
          cat v050-smoke.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "V050 FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" v050-smoke.log; then
            echo "La validación de Extras y del códice ha fallado; no se exportará."
            exit 1
          fi
          grep -q "V050 OK:" v050-smoke.log

      - name: Smoke test móvil de Extras 0.6.3
        run: |
          set +e
          godot --headless --path . --script res://scripts/ci_v063_mobile_extras_smoke_test.gd > v063-mobile-extras.log 2>&1
          STATUS=$?
          set -e
          cat v063-mobile-extras.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "V063 MOBILE EXTRAS FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" v063-mobile-extras.log; then
            echo "La validación táctil e iconográfica de Extras ha fallado; no se exportará."
            exit 1
          fi
          grep -q "V063 MOBILE EXTRAS OK:" v063-mobile-extras.log

      - name: Smoke test de partidas guardadas 0.7
        run: |
          set +e
          godot --headless --path . --script res://scripts/ci_v070_save_slots_smoke_test.gd > v070-save-slots.log 2>&1
          STATUS=$?
          set -e
          cat v070-save-slots.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "V070 SAVE SLOTS FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" v070-save-slots.log; then
            echo "La validación del sistema de partidas 0.7 ha fallado; no se exportará."
            exit 1
          fi
          grep -q "V070 SAVE SLOTS OK:" v070-save-slots.log

      - name: Smoke test de días y puzles narrativos 0.8
        run: |
          set +e
          godot --headless --path . --script res://scripts/ci_v080_narrative_days_smoke_test.gd > v080-narrative-days.log 2>&1
          STATUS=$?
          set -e
          cat v080-narrative-days.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "V080 NARRATIVE DAYS FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" v080-narrative-days.log; then
            echo "La validación de jornadas y puzles narrativos 0.8 ha fallado; no se exportará."
            exit 1
          fi
          grep -q "V080 NARRATIVE DAYS OK:" v080-narrative-days.log

      - name: Smoke test de monitores de Javi 0.8.1
        run: |
          set +e
          godot --headless --path . --script res://scripts/ci_v081_javi_monitor_smoke_test.gd > v081-javi-monitors.log 2>&1
          STATUS=$?
          set -e
          cat v081-javi-monitors.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "V081 JAVI MONITORS FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" v081-javi-monitors.log; then
            echo "La validación del primer plano interactivo de Javi ha fallado; no se exportará."
            exit 1
          fi
          grep -q "V081 JAVI MONITORS OK:" v081-javi-monitors.log

      - name: Smoke test de mapa y progreso 0.6/0.7
        run: |
          set +e
          godot --headless --path . --script res://scripts/ci_v069_progression_smoke_test.gd > v060-smoke.log 2>&1
          STATUS=$?
          set -e
          cat v060-smoke.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "V060 FAIL:|SCRIPT ERROR:|Parse Error:|Failed to load script" v060-smoke.log; then
            echo "La validación de mapa y progreso ha fallado; no se exportará."
            exit 1
          fi
          grep -q "V060 OK:" v060-smoke.log

      - name: Export Web y validar GDScript
        run: |
          rm -rf web
          mkdir -p web
          set +e
          godot --headless --export-release "Web" web/index.html > export.log 2>&1
          STATUS=$?
          set -e
          cat export.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Failed to load script" export.log; then
            echo "La exportación contiene errores de GDScript; no se publicará."
            exit 1
          fi
          test -s web/index.html
          test -s web/index.wasm
          test -s web/index.pck
          ./scripts/prepare_web_export.sh web "${GITHUB_SHA}" "${GAME_TITLE}"
          touch web/.nojekyll

      - name: Guardar exportación en el repositorio
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web
          if git diff --cached --quiet; then
            echo "Sin cambios en la exportación web"
          else
            git commit -m "build: actualizar exportación web de Godot"
            git push origin HEAD:main
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy-pages:
    name: Publicar GitHub Pages
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar juego
        id: deployment
        uses: actions/deploy-pages@v5

# Reintento de publicación 0.9.38 (23/08/2026)
