name: Export Godot Web

on:
  push:
    branches: [main]
    paths-ignore:
      - "web/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Export Web
        run: |
          rm -rf web
          mkdir -p web
          godot --headless --export-release "Web" web/index.html
          touch web/.nojekyll

      - name: Guardar exportación en el repositorio
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web
          if git diff --cached --quiet; then
            echo "Sin cambios en la exportación web"
          else
            git commit -m "build: actualizar exportación web de Godot"
            git push origin HEAD:main
          fi
