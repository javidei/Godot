name: Validar inicio 0.9.4

on:
  push:
    branches: [main]
    paths:
      - "scripts/version_090_unified_audio_manager.gd"
      - "scripts/naranjal_studio_splash.gd"
      - "scripts/ci_v094_startup_audio_smoke_test.gd"
      - "project.godot"
  workflow_dispatch:

jobs:
  startup-audio:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Importar recursos Godot
        run: |
          set +e
          godot --headless --editor --path . --quit > import.log 2>&1
          STATUS=$?
          set -e
          cat import.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Failed to load script" import.log; then
            exit 1
          fi
      - name: Validar splash y mute 0.9.4
        run: |
          set +e
          godot --headless --path . --script res://scripts/ci_v094_startup_audio_smoke_test.gd > v094.log 2>&1
          STATUS=$?
          set -e
          cat v094.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Failed to load script" v094.log; then
            exit 1
          fi
          grep -q "V094 STARTUP AUDIO OK:" v094.log
