name: Force Export Godot Web

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/force-export-web.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: godot-pages-force
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"

jobs:
  force-export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Aplicar hotfix de compatibilidad 0.9.42
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path

          transition = Path("scripts/version_044_visit_transitions_data.gd")
          text = transition.read_text(encoding="utf-8")
          if 'const NEW_GAME_INTRO_TITLE := ""' not in text:
              anchor = 'const DataStory = preload("res://scripts/story.gd")\n\n'
              replacement = anchor + 'const NEW_GAME_INTRO_TITLE := ""\nconst NEW_GAME_INTRO_TEXT := ""\n\n'
              if anchor not in text:
                  raise SystemExit("No se encuentra el ancla de compatibilidad en version_044_visit_transitions_data.gd")
              text = text.replace(anchor, replacement, 1)
              transition.write_text(text, encoding="utf-8")

          project = Path("project.godot")
          text = project.read_text(encoding="utf-8")
          text = text.replace('config/version="0.9.41"', 'config/version="0.9.42"', 1)
          if '; 0.9.42:' not in text:
              marker = '; 0.9.41: primera revisión de guion con nuevas frases de apertura, un Día 1 más natural y los primeros diálogos revisados de Javi.\n'
              line = '; 0.9.42: restauradas constantes vacías de compatibilidad para compilar la cadena heredada de transiciones sin recuperar el texto de 2026.\n'
              if marker in text:
                  text = text.replace(marker, marker + line, 1)
              else:
                  text = text.rstrip() + '\n' + line
          project.write_text(text, encoding="utf-8")

          changelog = Path("docs/CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          if '## [0.9.42] - 2026-08-23' not in text:
              section = (
                  '## [0.9.42] - 2026-08-23\n\n'
                  '### Fixed\n\n'
                  '- Restauradas como cadenas vacías las constantes heredadas `NEW_GAME_INTRO_TITLE` y `NEW_GAME_INTRO_TEXT`, necesarias para compilar `version_0917_visit_transitions.gd` sin volver a mostrar el antiguo texto de 2026.\n'
                  '- Corregida la publicación Web bloqueada por ese error de compilación y añadido un diagnóstico persistente del exportador forzado.\n\n'
              )
              marker = '## [0.9.41] - 2026-08-23\n'
              if marker not in text:
                  raise SystemExit("No se encuentra la sección 0.9.41 en CHANGELOG.md")
              text = text.replace(marker, section + marker, 1)
              changelog.write_text(text, encoding="utf-8")
          PY
          mkdir -p web
          printf 'STARTED 0.9.42 %s\n' "$GITHUB_SHA" > web/force-export-status.txt
          git add project.godot scripts/version_044_visit_transitions_data.gd docs/CHANGELOG.md web/force-export-status.txt
          if git diff --cached --quiet; then
            echo "Hotfix 0.9.42 ya aplicado"
          else
            git commit -m "fix: completar hotfix de publicación 0.9.42"
            git push origin HEAD:main
          fi

      - name: Preparar plantillas de exportación
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config"
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot "$HOME/.config/godot"
          fi
          mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Importar recursos y validar GDScript
        run: |
          set +e
          godot --headless --editor --path . --quit > import.log 2>&1
          STATUS=$?
          set -e
          cat import.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Failed to load script" import.log; then
            {
              echo "FAILED IMPORT"
              tail -n 120 import.log
            } > web/force-export-status.txt
            git add -f web/force-export-status.txt
            git commit -m "ci: registrar fallo de importación web" || true
            git push origin HEAD:main
            exit 1
          fi

      - name: Configurar título y versión
        run: |
          set +e
          godot --headless --path . --script res://scripts/configure_dynamic_title.gd > dynamic-title.log 2>&1
          STATUS=$?
          set -e
          cat dynamic-title.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Failed to load script" dynamic-title.log; then
            {
              echo "FAILED DYNAMIC TITLE"
              tail -n 120 dynamic-title.log
            } > web/force-export-status.txt
            git add -f web/force-export-status.txt
            git commit -m "ci: registrar fallo de título web" || true
            git push origin HEAD:main
            exit 1
          fi
          GAME_TITLE=$(sed -n 's/^DYNAMIC TITLE: //p' dynamic-title.log | tail -n 1)
          GAME_VERSION=$(sed -n 's/^config\/version="\([^"]*\)"/\1/p' project.godot | head -n 1)
          test -n "$GAME_TITLE"
          test -n "$GAME_VERSION"
          echo "GAME_TITLE=$GAME_TITLE" >> "$GITHUB_ENV"
          echo "GAME_VERSION=$GAME_VERSION" >> "$GITHUB_ENV"
          echo "Exportando Entre líneas ${GAME_VERSION}"

      - name: Exportar Web
        run: |
          rm -rf web
          mkdir -p web
          set +e
          godot --headless --export-release "Web" web/index.html > export.log 2>&1
          STATUS=$?
          set -e
          cat export.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Failed to load script" export.log; then
            {
              echo "FAILED EXPORT"
              tail -n 120 export.log
            } > web/force-export-status.txt
            git add -f web/force-export-status.txt
            git commit -m "ci: registrar fallo de exportación web" || true
            git push origin HEAD:main
            exit 1
          fi
          test -s web/index.html
          test -s web/index.wasm
          test -s web/index.pck
          ./scripts/prepare_web_export.sh web "${GITHUB_SHA}" "${GAME_TITLE}"
          printf '%s\n' "${GAME_VERSION}" > web/build-version.txt
          touch web/.nojekyll

      - name: Guardar exportación Web en main
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f web
          if git diff --cached --quiet; then
            echo "Sin cambios en la exportación web"
          else
            git commit -m "build: forzar exportación web de Godot ${GAME_VERSION}"
            git push origin HEAD:main
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy-pages:
    name: Publicar GitHub Pages (forzado)
    needs: force-export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar juego
        id: deployment
        uses: actions/deploy-pages@v5

# Reintento tras hotfix directo 0.9.42 (23/08/2026)
