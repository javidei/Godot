name: Validate Game

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "refactor/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-game-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar plantillas de exportación
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config"
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot "$HOME/.config/godot"
          fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          fi

      - name: Validar arquitectura y JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in Path("data").rglob("*.json"):
              with path.open("r", encoding="utf-8") as fh:
                  json.load(fh)
          print("JSON OK")
          PY
          git fetch origin main --depth=1 || true
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            NEW_VERSIONED=$(git diff --diff-filter=A --name-only origin/main...HEAD | grep -E '^(scripts/version_|scripts/main_v[0-9]|autoload/data_manager_v[0-9])' || true)
            if [ -n "$NEW_VERSIONED" ]; then
              echo "No se permiten nuevas capas runtime versionadas:"
              echo "$NEW_VERSIONED"
              exit 1
            fi
          fi

      - name: Importar proyecto y validar GDScript
        run: |
          set +e
          godot --headless --editor --path . --quit > import.log 2>&1
          STATUS=$?
          set -e
          cat import.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Failed to load script" import.log; then
            exit 1
          fi

      - name: Smoke tests de regresión
        run: |
          set -e
          TESTS="
          res://scripts/ci_datamanager_smoke_test.gd
          res://scripts/ci_v070_character_smoke_test.gd
          res://scripts/ci_v070_v044_transition_smoke_test.gd
          res://scripts/ci_v070_save_slots_smoke_test.gd
          res://scripts/ci_v080_narrative_days_smoke_test.gd
          res://scripts/ci_story_runtime_smoke_test.gd
          res://scripts/ci_save_resume_smoke_test.gd
          res://scripts/ci_v094_startup_audio_smoke_test.gd
          res://scripts/ci_v095_room_mute_runtime_test.gd
          "
          for TEST in $TESTS; do
            echo "=== $TEST ==="
            set +e
            timeout 90s godot --headless --path . --script "$TEST" > smoke.log 2>&1
            STATUS=$?
            set -e
            cat smoke.log
            if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Failed to load script| FAIL:" smoke.log; then
              exit 1
            fi
          done

      - name: Exportar y validar Web de prueba
        run: |
          rm -rf /tmp/entre-lineas-web
          mkdir -p /tmp/entre-lineas-web
          set +e
          godot --headless --export-release "Web" /tmp/entre-lineas-web/index.html > export.log 2>&1
          STATUS=$?
          set -e
          cat export.log
          if [ "$STATUS" -ne 0 ] || grep -Eqi "SCRIPT ERROR:|Parse Error:|Failed to load script" export.log; then
            exit 1
          fi
          test -s /tmp/entre-lineas-web/index.html
          test -s /tmp/entre-lineas-web/index.pck
          test -s /tmp/entre-lineas-web/index.wasm
          GAME_TITLE=$(sed -n 's/^config\/name="\([^"]*\)"/\1/p' project.godot | head -n1)
          test -n "$GAME_TITLE"
          ./scripts/prepare_web_export.sh /tmp/entre-lineas-web "ci-${GITHUB_SHA}" "$GAME_TITLE"
          grep -Fq 'ENTRE_LINEAS_LOADING_UI' /tmp/entre-lineas-web/index.html
          grep -Fq '>CARGANDO...</div>' /tmp/entre-lineas-web/index.html
          grep -Fq 'display: none !important;' /tmp/entre-lineas-web/index.html
