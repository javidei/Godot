name: Reparar main.gd

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-main-gd.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Corregir tipado de GDScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/main.gd')
          text = path.read_text(encoding='utf-8')
          old = '\t\tvar active := focus == "all" or focus == character'
          new = '\t\tvar active: bool = focus == "all" or focus == str(character)'
          if old not in text:
              print('La corrección ya estaba aplicada')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('Tipado corregido')
          PY

      - name: Guardar corrección
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/main.gd
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "fix: corregir tipado que dejaba el juego en negro"
            git push origin HEAD:main
          fi
